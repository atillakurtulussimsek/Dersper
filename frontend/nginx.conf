server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Çıktı dosyaları (PDF/Excel) ve yapay zeka yanıtları büyük olabilir.
    client_max_body_size 16m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Bu yapılandırmanın gerçekten yüklü olduğunu doğrulamak için imza.
    # 404 dönüyorsa konteyner nginx'in kendi varsayılan ayarıyla çalışıyordur.
    location = /nginx-ok {
        add_header Content-Type text/plain;
        return 200 "dersper-nginx\n";
    }

    # API istekleri backend'e. Aynı köken üzerinden gittiği için CORS gerekmez.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Program üretimi arka planda çalışır ama ilk yanıt gecikebilir;
        # ayrıca yapay zeka çağrıları yavaş olabilir.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Derlenmiş varlıklar adlarında özet taşır, uzun süre önbelleklenebilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Tek sayfa uygulaması: /kayit, /programlar/3 gibi adresler sunucuda
    # karşılığı olmadığı için index.html'e düşürülür.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
