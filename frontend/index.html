<!doctype html>
<html lang="tr" class="koyu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dersper — Ders Dağıtım Programı</title>
  </head>
  <body>
    <script>
      // Tema React yüklenmeden uygulanır; aksi halde koyu temada bir kare
      // beyaz parlama olur.
      (function () {
        try {
          var t = localStorage.getItem("dersper_tema") || "koyu";
          var koyu =
            t === "koyu" ||
            (t === "sistem" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("koyu", koyu);
          document.documentElement.style.colorScheme = koyu ? "dark" : "light";
        } catch (e) {
          document.documentElement.classList.add("koyu");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
