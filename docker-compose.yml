# Dersper — üretim dağıtımı (Dokploy, Coolify, düz Docker).
#
# TEK servis: FastAPI hem /api'yi hem derlenmiş arayüzü sunar. Ayrı web sunucusu
# ve konteynerler arası ağ yoktur; tek alan adı yeter, CORS ayarı gerekmez.
#
# Ayarların tamamı kökteki .env dosyasından okunur:
#   cp .env.example .env   ve içini doldurun.
#
# Veritabanı harici bir MySQL 8 sunucusudur; DATABASE_URL ile verilir.
#
# PORT YAYIMLAMA: burada bilerek ana makineye port bağlanmaz. Dokploy/Coolify
# gibi ortamlar kendi ters vekilleriyle konteynere ulaşır. Panelden alan adınızı
# `app` servisinin 8000 numaralı portuna yönlendirin.
#
# Vekilsiz, düz Docker ile çalıştıracaksanız port yayımlayan ek dosyayı kullanın:
#   docker compose -f docker-compose.yml -f docker-compose.standalone.yml up -d

services:
  app:
    build:
      # Bağlam depo kökü: imaj hem backend'i hem frontend'i derler.
      context: .
      dockerfile: backend/Dockerfile
    # .env içindeki tüm değişkenler olduğu gibi aktarılır.
    env_file:
      - .env
    environment:
      # Konteyner içinde her arayüzü dinlemeli; .env'deki 127.0.0.1 geçersizdir.
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8000"
      # Arayüz aynı kökenden sunulduğu için CORS'a gerek yok.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      # Yalnızca sürecin ayakta olduğunu yoklar. Veritabanı durumu
      # /api/health/db adresinden ayrıca sorulur; arayüz sebebi kendisi gösterir.
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      # Açılışta migration çalıştığı için ilk kontrol geciktirilir.
      start_period: 60s
      retries: 3
